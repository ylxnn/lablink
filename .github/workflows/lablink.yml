name: LabLink checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lab.lock.txt
      - run: python -m pytest tests --cov=app.lab --cov-report=term-missing
      - run: python -m ruff check backend/app/lab backend/app/main.py tests --select F
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd frontend && npm ci --workspaces=false && npm run build
